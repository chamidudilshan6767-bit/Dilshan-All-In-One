<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Feed - Dilshan All In One</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #030712; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; position: relative; }

        header, .container, .footer { z-index: 1; position: relative; width: 100%; max-width: 480px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #00f0ff; font-size: 1.6rem; text-shadow: 0 0 12px rgba(0, 240, 255, 0.7); text-transform: uppercase; }
        header p { color: #8ab4f8; font-size: 0.88rem; }

        .back-btn { display: inline-block; padding: 8px 16px; background: #081028; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 0.85rem; margin-bottom: 15px; text-transform: uppercase; }

        .feed-card {
            background: rgba(8, 16, 40, 0.9); border: 1px solid #00f0ff; border-radius: 14px;
            padding: 16px; margin-bottom: 18px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            position: relative; word-wrap: break-word;
        }
        .feed-card .time-badge { font-size: 11px; color: #00ffcc; margin-bottom: 10px; display: block; }
        .feed-card .text-content { font-size: 0.95rem; color: #e2e8f0; line-height: 1.5; margin-bottom: 12px; white-space: pre-line; }

        .media-box { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: #030712; border: 1px solid #0088ff; }
        .media-box img { width: 100%; height: auto; display: block; object-fit: contain; max-height: 350px; }
        .media-box video { width: 100%; height: auto; display: block; }
        .media-box audio { width: 100%; padding: 10px; }
        
        .action-link-btn {
            display: block; width: 100%; padding: 12px; margin-top: 10px;
            background: linear-gradient(90deg, #0072ff, #00f0ff); color: #000;
            font-weight: bold; border-radius: 8px; text-align: center; text-decoration: none;
            font-size: 0.9rem; text-transform: uppercase; box-shadow: 0 0 12px rgba(0,240,255,0.6);
        }

        .no-posts { text-align: center; color: #8ab4f8; font-size: 0.9rem; padding: 30px; background: #081028; border-radius: 12px; border: 1px dashed #00f0ff; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #5a738e; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="back-btn">⬅️ Back to Home</a>
        <h1>📢 Admin Announcements</h1>
        <p>Live updates & media shared by Dilshan</p>
    </header>

    <div class="container" id="feedContainer">
        <div class="no-posts">Loading announcements...</div>
    </div>

    <div class="footer">© Powered by Dilshan</div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

        async function loadAdminNotices() {
            try {
                let res = await fetch('/api/get-notices');
                let data = await res.json();
                let container = document.getElementById('feedContainer');

                if (!data.notices || data.notices.length === 0) {
                    container.innerHTML = '<div class="no-posts">No announcements published yet. Check back later!</div>';
                    return;
                }

                let html = '';
                data.notices.forEach(notice => {
                    html += `<div class="feed-card">`;
                    html += `<span class="time-badge">🕒 ${notice.time}</span>`;
                    
                    if (notice.text) {
                        html += `<div class="text-content">${notice.text}</div>`;
                    }

                    if (notice.mediaData) {
                        html += `<div class="media-box">`;
                        if (notice.mediaType === 'image') {
                            html += `<img src="${notice.mediaData}" alt="Admin Image">`;
                        } else if (notice.mediaType === 'video') {
                            html += `<video controls src="${notice.mediaData}"></video>`;
                        } else if (notice.mediaType === 'audio') {
                            html += `<audio controls src="${notice.mediaData}"></audio>`;
                        } else if (notice.mediaType === 'file') {
                            html += `<div style="padding:15px; text-align:center;"><a href="${notice.mediaData}" download="file" style="color:#00f0ff; font-weight:bold;">📥 Download Shared File</a></div>`;
                        }
                        html += `</div>`;
                    }

                    if (notice.postLink) {
                        html += `<a href="${notice.postLink}" target="_blank" class="action-link-btn">🔗 ${notice.linkButtonText || 'Open Link'}</a>`;
                    }

                    html += `</div>`;
                });

                container.innerHTML = html;
            } catch(e) {
                document.getElementById('feedContainer').innerHTML = '<div class="no-posts">Failed to load feed!</div>';
            }
        }

        loadAdminNotices();
        setInterval(loadAdminNotices, 8000);
    </script>
</body>
</html>
