<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Updates & Media - Dilshan All In One</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #030712; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card {
            background: rgba(8, 16, 40, 0.95); border: 1px solid #00ffcc; padding: 25px;
            border-radius: 16px; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3); margin-top: 10px; position: relative;
        }
        
        .back-link { display: block; text-align: left; margin-bottom: 15px; color: #00ffcc; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        h1 { color: #00ffcc; font-size: 1.4rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,204,0.6); text-transform: uppercase; }
        
        .feed-item { background: #030712; border-left: 3px solid #00ffcc; padding: 14px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95rem; color: #fff; text-align: left; }
        .feed-item img, .feed-item video { width: 100%; border-radius: 6px; margin-top: 10px; max-height: 350px; object-fit: contain; }
        .feed-item audio { width: 100%; margin-top: 10px; }
        .feed-item a.file-dl-btn { display: inline-block; margin-top: 10px; padding: 10px 16px; background: #00ffcc; color: #000; font-weight: bold; text-decoration: none; border-radius: 6px; font-size: 0.9rem; }
        .feed-time { font-size: 11px; color: #8ab4f8; margin-top: 8px; display: block; text-align: right; }
        
        .no-posts { color: #8ab4f8; font-size: 14px; padding: 30px; }
        .footer-text { margin-top: 20px; font-size: 12px; color: #5a738e; }
    </style>
</head>
<body>

    <div class="card">
        <a href="/" class="back-link">← Back to Home</a>
        
        <h1>Admin Updates & Media</h1>
        
        <div id="updatesContainer">
            <div class="no-posts">Loading updates...</div>
        </div>

        <div class="footer-text">© Powered by Dilshan</div>
    </div>

    <script>
        async function loadAdminUpdates() {
            try {
                let res = await fetch('/api/get-notices');
                let data = await res.json();
                let container = document.getElementById('updatesContainer');

                if (!data.notices || data.notices.length === 0) {
                    container.innerHTML = '<div class="no-posts">No updates or media posted by Admin yet.</div>';
                    return;
                }

                let html = '';
                data.notices.forEach(n => {
                    let mediaContent = '';
                    if (n.mediaType === 'image' && n.mediaData) {
                        mediaContent = `<img src="${n.mediaData}" alt="Admin Image">`;
                    } else if (n.mediaType === 'audio' && n.mediaData) {
                        mediaContent = `<audio controls src="${n.mediaData}"></audio>`;
                    } else if (n.mediaType === 'video' && n.mediaData) {
                        mediaContent = `<video controls src="${n.mediaData}"></video>`;
                    } else if (n.mediaType === 'file' && n.mediaData) {
                        mediaContent = `<br><a href="${n.mediaData}" download="Admin-File" class="file-dl-btn">📎 Download Attached File</a>`;
                    }

                    html += `
                        <div class="feed-item">
                            ${n.text ? '📢 ' + n.text : ''}
                            ${mediaContent}
                            <span class="feed-time">${n.time}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) {
                document.getElementById('updatesContainer').innerHTML = '<div class="no-posts">Failed to load updates.</div>';
            }
        }

        window.onload = loadAdminUpdates;
    </script>
</body>
</html>
