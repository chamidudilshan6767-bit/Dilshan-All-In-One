<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Unban - Dilshan All In One</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { width: 100%; max-width: 450px; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06); }
        .back-link { display: inline-block; margin-bottom: 15px; color: #128c7e; text-decoration: none; font-weight: bold; font-size: 14px; }
        h2 { text-align: center; color: #075e54; font-size: 1.4rem; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; color: #333; font-size: 15px; outline: none; margin-bottom: 12px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #25d366; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1ebd56; }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h2>WhatsApp Unban Appeal</h2>
    <input type="text" id="wa-number" class="input-field" placeholder="Enter Phone Number (+94...)">
    <button class="btn" onclick="sendUnbanAppeal()">Send Appeal Email</button>
    <div class="footer">© Powered by Dilshan</div>
</div>
<script>
    function sendUnbanAppeal() {
        const num = document.getElementById('wa-number').value.trim();
        if (!num) { alert("Please enter your banned phone number!"); return; }
        const subject = encodeURIComponent("Banned WhatsApp Account Appeal");
        const body = encodeURIComponent(`Hello WhatsApp Support,\n\nMy WhatsApp number (${num}) has been banned by mistake. Please unban my account.\n\nThank you.`);
        window.location.href = `mailto:support@whatsapp.com?subject=${subject}&body=${body}`;
    }
</script>
</body>
</html>
