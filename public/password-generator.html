<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Password Generator - Dilshan All In One</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI'; padding: 20px; }
        .card { background: #121824; border: 1px solid #1f293d; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; }
        .input-field { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #2a364f; background: #0b0e14; color: #fff; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(90deg, #0072ff, #00c6ff); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" style="color: #00c6ff; text-decoration: none; font-weight: bold;">&larr; Back to Home</a>
    <h2 style="color: #00c6ff; margin-top: 15px;">Password Generator</h2>
    <input type="text" id="pass-result" class="input-field" readonly placeholder="Generated Password">
    <button class="btn" onclick="generatePassword()">Generate Password</button>
</div>
<script>
    function generatePassword() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
        let pass = "";
        for (let i = 0; i < 12; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('pass-result').value = pass;
    }
</script>
</body>
</html>
