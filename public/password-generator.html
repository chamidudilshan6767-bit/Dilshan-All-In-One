<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Password Generator - Dilshan All In One</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .card { background: #121824; border: 1px solid #1f293d; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #2a364f; background: #0b0e14; color: #fff; outline: none; }
        .opt-group { margin: 10px 0; font-size: 13px; color: #8a99ad; display: flex; flex-direction: column; gap: 8px; }
        .opt-row { display: flex; align-items: center; gap: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(90deg, #0072ff, #00c6ff); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" style="color: #00c6ff; text-decoration: none; font-weight: bold;">&larr; Back to Home</a>
    <h2 style="color: #00c6ff; margin-top: 15px; text-align: center;">Custom Password Generator</h2>
    
    <input type="text" id="prefix-name" class="input-field" placeholder="Custom Name/Prefix (e.g. Dilshan#)">
    
    <div class="opt-group">
        <div class="opt-row">
            <label>Length:</label>
            <input type="number" id="pass-len" value="12" min="6" max="32" style="width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #2a364f; background: #0b0e14; color: #fff;">
        </div>
        <div class="opt-row">
            <input type="checkbox" id="inc-num" checked> Include Numbers (0-9)
        </div>
        <div class="opt-row">
            <input type="checkbox" id="inc-sym" checked> Include Symbols (@#$%)
        </div>
    </div>

    <input type="text" id="pass-result" class="input-field" readonly placeholder="Your Generated Password">
    <button class="btn" onclick="generateCustomPassword()">Generate Password</button>
</div>

<script>
    function generateCustomPassword() {
        const prefix = document.getElementById('prefix-name').value.trim();
        const length = parseInt(document.getElementById('pass-len').value) || 12;
        const incNum = document.getElementById('inc-num').checked;
        const incSym = document.getElementById('inc-sym').checked;

        let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        if (incNum) letters += "0123456789";
        if (incSym) letters += "!@#$%^&*()_+-=";

        let randomPart = "";
        for (let i = 0; i < length; i++) {
            randomPart += letters.charAt(Math.floor(Math.random() * letters.length));
        }

        document.getElementById('pass-result').value = prefix ? `${prefix}${randomPart}` : randomPart;
    }
</script>
</body>
</html>
