<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Dilshan All In One</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-weight: bold; text-align: center; }
        button { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
        .back-link { display: block; text-align: center; margin-bottom: 15px; color: #075e54; text-decoration: none; }
        .controls { text-align: left; margin-bottom: 15px; }
        .controls label { display: block; margin: 8px 0; }
    </style>
</head>
<body>

<div class="card">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h2>Password Generator</h2>
    
    <input type="text" id="password" readonly placeholder="Your Password Here">
    
    <div class="controls">
        <label>Length: <input type="number" id="length" value="12" min="6" max="30" style="width: 60px; padding: 5px;"></label>
    </div>

    <button onclick="generatePassword()">Generate Password</button>
    <button onclick="copyPassword()" style="background: #007bff;">Copy Password</button>
</div>

<script>
function generatePassword() {
    const length = document.getElementById('length').value;
    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
    let password = "";
    for (let i = 0; i < length; i++) {
        let at = Math.floor(Math.random() * charset.length);
        password += charset.charAt(at);
    }
    document.getElementById('password').value = password;
}

function copyPassword() {
    const passInput = document.getElementById('password');
    if (!passInput.value) {
        alert("Generate a password first!");
        return;
    }
    passInput.select();
    document.execCommand("copy");
    alert("Password copied to clipboard!");
}

// Auto generate on load
generatePassword();
</script>

</body>
</html>
