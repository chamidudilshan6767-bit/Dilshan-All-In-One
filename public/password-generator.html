<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Dilshan All In One</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { width: 100%; max-width: 450px; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06); }
        .back-link { display: inline-block; margin-bottom: 15px; color: #128c7e; text-decoration: none; font-weight: bold; font-size: 14px; }
        h2 { text-align: center; color: #075e54; font-size: 1.4rem; margin-bottom: 15px; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; color: #333; font-size: 15px; outline: none; margin-bottom: 12px; }
        .opt-group { margin: 12px 0; font-size: 14px; color: #555; display: flex; flex-direction: column; gap: 8px; }
        .opt-row { display: flex; align-items: center; gap: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #25d366; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1ebd56; }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h2>Password Generator</h2>
    <input type="text" id="prefix-name" class="input-field" placeholder="Custom Name/Prefix (e.g. Dilshan#)">
    <div class="opt-group">
        <div class="opt-row">
            <label>Length:</label>
            <input type="number" id="pass-len" value="12" min="6" max="32" style="width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; background: #f9f9f9; color: #333;">
        </div>
        <div class="opt-row"><input type="checkbox" id="inc-num" checked> Include Numbers (0-9)</div>
        <div class="opt-row"><input type="checkbox" id="inc-sym" checked> Include Symbols (@#$%)</div>
    </div>
    <input type="text" id="pass-result" class="input-field" readonly placeholder="Your Generated Password">
    <button class="btn" onclick="generateCustomPassword()">Generate Password</button>
    <div class="footer">© Powered by Dilshan</div>
</div>
<script>
    function generateCustomPassword() {
        const prefix = document.getElementById('prefix-name').value.trim();
        const length = parseInt(document.getElementById('pass-len').value) || 12;
        const incNum = document.getElementById('inc-num').checked;
        const incSym = document.getElementById('inc-sym').checked;
        let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        if (incNum) letters += "0123456789";
        if (incSym) letters += "!@#$%^&*()_+-=";
        let randomPart = "";
        for (let i = 0; i < length; i++) {
            randomPart += letters.charAt(Math.floor(Math.random() * letters.length));
        }
        document.getElementById('pass-result').value = prefix ? `${prefix}${randomPart}` : randomPart;
    }
</script>
</body>
</html>
