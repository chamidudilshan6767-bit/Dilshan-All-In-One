<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Dilshan All In One</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #1eb857; }
        .back-link { display: block; text-align: center; margin-bottom: 15px; color: #075e54; text-decoration: none; }
        #result { margin-top: 20px; display: none; }
        .download-btn { display: inline-block; width: 100%; background: #007bff; color: white; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h2>TikTok Video Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste TikTok Video Link here...">
    <button onclick="downloadVideo()">Fetch Video</button>

    <div id="result">
        <p style="color: green; font-weight: bold;">Video Ready!</p>
        <a id="dlLink" href="#" target="_blank" class="download-btn">Download Without Watermark</a>
    </div>
</div>

<script>
async function downloadVideo() {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) {
        alert("Please paste a TikTok video URL!");
        return;
    }

    alert("Fetching video... Please wait.");

    try {
        const response = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data && data.video && data.video.noWatermark) {
            document.getElementById('dlLink').href = data.video.noWatermark;
            document.getElementById('result').style.display = 'block';
        } else {
            alert("Could not fetch video. Please check the link and try again.");
        }
    } catch (error) {
        alert("Error fetching video. Please try again later.");
    }
}
</script>

</body>
</html>
