<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Dilshan All In One</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030712; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        .neon-gem {
            position: fixed;
            background: radial-gradient(circle, #00ffff 0%, #0088ff 60%, transparent 100%);
            box-shadow: 0 0 12px #00f0ff, 0 0 25px #0077ff;
            border-radius: 40% 60% 50% 50% / 40% 50% 60% 50%;
            pointer-events: none;
            opacity: 0.8;
            animation: fallAndGlow linear infinite;
            z-index: 0;
        }
        @keyframes fallAndGlow {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .card { width: 100%; max-width: 450px; background: rgba(8, 16, 40, 0.95); border: 1px solid #00f0ff; padding: 25px; border-radius: 16px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.35); z-index: 1; position: relative; backdrop-filter: blur(8px); }
        .back-link { display: inline-block; margin-bottom: 15px; color: #00f0ff; text-decoration: none; font-weight: bold; font-size: 14px; }
        h2 { text-align: center; color: #00f0ff; font-size: 1.4rem; margin-bottom: 15px; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0a4f8a; background: #050b18; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; }
        .input-field:focus { border-color: #00f0ff; box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(90deg, #0072ff, #00f0ff); color: #000; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 12px rgba(0,240,255,0.6); }
        #result-section { display: none; margin-top: 20px; border-top: 1px solid #0a4f8a; padding-top: 15px; }
        .video-preview { width: 100%; border-radius: 10px; max-height: 280px; object-fit: cover; margin-bottom: 10px; border: 1px solid #00f0ff; }
        .dl-btn { display: block; width: 100%; padding: 11px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; color: #000; margin-bottom: 8px; font-size: 0.9rem; background: #00f0ff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.5); }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #5a738e; }
    </style>
</head>
<body>
<script>
    for (let i = 0; i < 15; i++) {
        let gem = document.createElement('div');
        gem.className = 'neon-gem';
        let size = Math.random() * 8 + 6 + 'px';
        gem.style.width = size;
        gem.style.height = size;
        gem.style.left = Math.random() * 100 + 'vw';
        gem.style.animationDuration = Math.random() * 6 + 4 + 's';
        gem.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(gem);
    }
</script>

<div class="card">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h2>TikTok Downloader</h2>
    <input type="text" id="tiktok-url" class="input-field" placeholder="Paste TikTok Link Here...">
    <button class="btn" onclick="downloadTikTok()">Download Video</button>
    
    <div id="result-section">
        <video id="vid-preview" class="video-preview" controls></video>
        <p id="vid-desc" style="font-size:0.85rem; color:#b0c4de; margin-bottom:12px;"></p>
        <a id="dl-1080" href="#" target="_blank" class="dl-btn">Download 1080p (No Watermark)</a>
        <a id="dl-720" href="#" target="_blank" class="dl-btn">Download 720p (No Watermark)</a>
        <a id="dl-audio" href="#" target="_blank" class="dl-btn" style="background:#a855f7; color:#fff; box-shadow:0 0 12px rgba(168,85,247,0.5);">Download Audio (MP3)</a>
    </div>
    <div class="footer">© Powered by Dilshan</div>
</div>
<script>
async function downloadTikTok() {
    const url = document.getElementById('tiktok-url').value.trim();
    if (!url) { alert("Please paste a valid TikTok link!"); return; }
    alert("Fetching Video...");
    try {
        const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const responseData = await res.json();
        if (responseData && responseData.code === 0 && responseData.data) {
            const data = responseData.data;
            document.getElementById('vid-preview').src = data.play;
            document.getElementById('vid-desc').innerText = data.title || "";
            document.getElementById('dl-1080').href = data.hdplay || data.play;
            document.getElementById('dl-720').href = data.play;
            document.getElementById('dl-audio').href = data.music || "#";
            document.getElementById('result-section').style.display = 'block';
        } else { alert("Failed to fetch video."); }
    } catch (err) { alert("Error downloading video."); }
}
</script>
</body>
</html>
