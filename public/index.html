<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilshan All In One - Utility Toolbox</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .card {
            background: #121824;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-img {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            margin-bottom: 10px;
            border: 2px solid #1f293d;
            object-fit: contain;
            background: #0b0e14;
        }
        header h1 {
            color: #00c6ff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        header p {
            color: #8a99ad;
            font-size: 0.9rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .tool-card {
            background: #192233;
            border: 1px solid #2a364f;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }
        .tool-card:hover {
            transform: translateY(-2px);
            border-color: #00c6ff;
        }
        .tool-info h2 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 3px;
        }
        .tool-info p {
            font-size: 0.8rem;
            color: #8a99ad;
        }
        .btn-open {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #5a6b82;
        }
    </style>
</head>
<body>

<div class="card">
    <header>
        <img src="/logo.png" alt="Logo" class="logo-img">
        <h1>Dilshan All In One</h1>
        <p>Your ultimate utility toolbox</p>
    </header>

    <div class="container">
        <!-- TikTok Downloader -->
        <div class="tool-card">
            <div class="tool-info">
                <h2>TikTok Downloader</h2>
                <p>1080p, 720p & MP3 (No Watermark)</p>
            </div>
            <a href="/tiktok-downloader.html" class="btn-open">Open</a>
        </div>

        <!-- Custom QR Code Generator -->
        <div class="tool-card">
            <div class="tool-info">
                <h2>Custom QR Generator</h2>
                <p>Colors & Logo/Image Support</p>
            </div>
            <a href="/qr-generator.html" class="btn-open">Open</a>
        </div>

        <!-- Custom Password Generator -->
        <div class="tool-card">
            <div class="tool-info">
                <h2>Custom Pass Generator</h2>
                <p>Custom Prefix & Secure Options</p>
            </div>
            <a href="/password-generator.html" class="btn-open">Open</a>
        </div>

        <!-- WhatsApp Unban -->
        <div class="tool-card">
            <div class="tool-info">
                <h2>WhatsApp Unban</h2>
                <p>Generate appeal support email</p>
            </div>
            <a href="/whatsapp-unban.html" class="btn-open">Open</a>
        </div>
    </div>

    <div class="footer">
        © Powered by Dilshan
    </div>
</div>

</body>
</html>
