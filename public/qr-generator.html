<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom QR Generator - Dilshan All In One</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #030712; color: #ffffff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card {
            background: rgba(8, 16, 40, 0.95); border: 1px solid #00f0ff; padding: 25px;
            border-radius: 16px; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); margin-top: 20px;
        }
        h1 { color: #00f0ff; font-size: 1.5rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,240,255,0.6); text-transform: uppercase; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #8ab4f8; margin-bottom: 5px; text-transform: uppercase; }
        input[type="text"] { width: 100%; padding: 12px; background: #030712; border: 1px solid #00f0ff; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
        
        .color-pickers { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .color-pickers div { flex: 1; text-align: left; }
        input[type="color"] { width: 100%; height: 40px; border: 1px solid #00f0ff; background: #030712; border-radius: 8px; cursor: pointer; padding: 2px; }

        .btn {
            display: block; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold;
            cursor: pointer; border: none; background: linear-gradient(90deg, #0072ff, #00f0ff); color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.7); text-transform: uppercase; font-size: 1rem; margin-top: 10px;
        }
        .btn-download {
            background: linear-gradient(90deg, #00ffcc, #00aa77); color: #000; box-shadow: 0 0 15px rgba(0, 255, 204, 0.7); display: none; margin-top: 12px;
        }

        #qrcode { margin: 20px auto; display: flex; justify-content: center; background: #fff; padding: 15px; border-radius: 12px; width: fit-content; }
        
        .back-link { display: inline-block; margin-top: 20px; color: #8ab4f8; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #00f0ff; text-decoration: underline; }
    </style>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="card">
        <h1>Custom QR Generator</h1>
        
        <div class="input-group">
            <label>Enter URL or Text:</label>
            <input type="text" id="qrText" value="https://Dilshan-all-in-one-production.up.railway.app" placeholder="Enter link...">
        </div>

        <div class="color-pickers">
            <div>
                <label>QR Color:</label>
                <input type="color" id="qrColor" value="#00f0ff">
            </div>
            <div>
                <label>Background:</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>

        <button class="btn" onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode"></div>

        <button id="downloadBtn" class="btn btn-download" onclick="downloadQR()">📥 Download QR Code</button>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let qrCodeInstance = null;

        function generateQR() {
            let text = document.getElementById('qrText').value.trim();
            let fgColor = document.getElementById('qrColor').value;
            let bgColor = document.getElementById('bgColor').value;

            if (!text) {
                alert("Please enter text or URL!");
                return;
            }

            document.getElementById('qrcode').innerHTML = "";

            qrCodeInstance = new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: 200,
                height: 200,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadQR() {
            let img = document.querySelector('#qrcode img');
            if (!img) {
                let canvas = document.querySelector('#qrcode canvas');
                if (canvas) {
                    img = canvas.toDataURL("image/png");
                }
            }

            if (img) {
                let link = document.createElement('a');
                link.href = typeof img === 'string' ? img : img.src;
                link.download = 'Dilshan-Custom-QR.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("QR Code image not found! Please generate first.");
            }
        }

        // Auto generate on load
        window.onload = function() {
            generateQR();
        };
    </script>
</body>
</html>
