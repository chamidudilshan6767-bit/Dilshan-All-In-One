<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>QR Generator - Dilshan All In One</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI'; padding: 20px; }
        .card { background: #121824; border: 1px solid #1f293d; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; }
        .input-field { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #2a364f; background: #0b0e14; color: #fff; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(90deg, #0072ff, #00c6ff); color: white; font-weight: bold; cursor: pointer; }
        #qrcode { display: flex; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" style="color: #00c6ff; text-decoration: none; font-weight: bold;">&larr; Back to Home</a>
    <h2 style="color: #00c6ff; margin-top: 15px;">QR Code Generator</h2>
    <input type="text" id="qr-text" class="input-field" placeholder="Enter Text or URL...">
    <button class="btn" onclick="generateQR()">Generate QR Code</button>
    <div id="qrcode"></div>
</div>
<script>
    function generateQR() {
        const text = document.getElementById('qr-text').value;
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        if (text) new QRCode(qrContainer, { text: text, width: 150, height: 150 });
    }
</script>
</body>
</html>
